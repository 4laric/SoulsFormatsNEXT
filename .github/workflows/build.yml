name: Build

on:
  pull_request:
  push:
    branches: [master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # net48 is one of the target frameworks, so build on Windows where the
    # .NET Framework 4.8 targeting pack is preinstalled.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SoulsFormats.sln

      - name: Build (${{ matrix.configuration }})
        # Builds both target frameworks (net48 + netstandard2.1).
        run: dotnet build SoulsFormats.sln -c ${{ matrix.configuration }} --no-restore
